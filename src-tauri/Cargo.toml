[package]
name = "tute"
description = "Tute for Windows — a little island at the top of your screen"
authors = ["Abdelrhman Mohamed"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# AI providers (ai.rs): one HTTP client for every protocol, no vendor SDKs.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Only for the "stream went silent" timer in ai.rs; Tauri already runs on tokio.
tokio = { version = "1", features = ["time"] }
# Provider API keys in the Windows Credential Manager (secrets.rs).
keyring = { version = "3", features = ["windows-native"] }
# Needed by `#[implement]` (drop_target.rs); same version as `windows` below.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
